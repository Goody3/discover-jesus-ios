name: iOS CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: xcode-27
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve simulator destination
        shell: bash
        run: |
          set -euo pipefail

          DESTINATIONS="$(xcodebuild -workspace DiscoverJesusPlatform.xcworkspace -scheme DiscoverJesus -showdestinations 2>/dev/null || true)"
          SIMULATOR_ID="$(printf '%s\n' "$DESTINATIONS" | sed -nE '/error:/d; s/.*platform:iOS Simulator, .*id:([[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}).*/\1/p' | awk 'NR == 1 {print}')"

          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "No eligible iOS simulator destination found for scheme DiscoverJesus."
            echo "$DESTINATIONS"
            exit 1
          fi

          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build and run tests (no signing required)
        run: |
          set -euo pipefail

          mkdir -p TestResults
          xcodebuild \
            -workspace DiscoverJesusPlatform.xcworkspace \
            -scheme DiscoverJesus \
            -destination "id=${SIMULATOR_ID}" \
            -configuration Debug \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/ios-coverage.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean build test

      - name: Summarize app line coverage
        run: |
          set -euo pipefail

          xcrun xccov view --report --json TestResults/ios-coverage.xcresult > TestResults/ios-coverage.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("TestResults/ios-coverage.json").read_text(encoding="utf-8"))
          app_targets = [
              target for target in report["targets"]
              if Path(target["buildProductPath"]).name == "DiscoverJesus"
          ]
          if len(app_targets) != 1:
              raise SystemExit(f"Expected one DiscoverJesus app target, found {len(app_targets)}.")

          coverage = float(app_targets[0]["lineCoverage"])
          summary = f"## iOS app test coverage\n\n- Line coverage: **{coverage:.2%}**\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage
          path: |
            TestResults/ios-coverage.xcresult
            TestResults/ios-coverage.json
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: OSV scan manifests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
